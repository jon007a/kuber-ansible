[balancer]
balancer1 ansible_host=(Your_IP) ansible_user=(Your_username)

[masters]
master1 ansible_host=(Your_IP) ansible_user=(Your_username)
master2 ansible_host=(Your_IP) ansible_user=(Your_username)
[workers]
worker1 ansible_host=(Your_IP) ansible_user=(Your_username)
worker2 ansible_host=(Your_IP) ansible_user=(Your_username)

[all:vars]
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3